<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — VaresaJasher</title>
  <meta name="theme-color" content="#171226">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Menu dashboard">
      <a class="brand" href="/" aria-label="VaresaJasher">
        <span class="brand-mark">VJ</span>
        <span class="brand-name">Varesa<b>Jasher</b></span>
      </a>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
        <h1 id="pageTitle">Dashboard</h1>
        <a class="saldo-chip" href="#/wallet" id="saldoChip"><span>Saldo</span> <b id="saldoValue">-</b></a>
      </header>
      <main class="content" id="view">
        <div class="loading-view"><div class="spinner"></div></div>
      </main>
    </div>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
